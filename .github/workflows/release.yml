name: Release

# Push a tag like v0.8.0 to build the app and publish it as a GitHub release.
# The tag must match the version in src-tauri/tauri.conf.json.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: Apple silicon
          - target: x86_64-apple-darwin
            name: Intel
    name: macOS (${{ matrix.name }})
    runs-on: macos-latest
    env:
      # Signing is optional. Without these secrets the build is unsigned and users must allow it in
      # System Settings → Privacy & Security the first time they open it.
      HAS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in tauri.conf.json (v$version)"
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: Tests
        run: |
          python3 scripts/i18n-check.py
          pnpm test
          (cd src-tauri && cargo test)

      # The same text is shown in the app's update dialog (English, then Chinese after a <!--zh--> line)
      - name: Release notes from the changelog
        id: notes
        run: |
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          {
            echo 'body<<NOTES_EOF'
            python3 scripts/latest-json.py --notes "$version"
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign and notarize
        if: env.HAS_CERTIFICATE == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signs the update packages; the app verifies them with the public key in tauri.conf.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Cloud Notebook ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --config {"bundle":{"createUpdaterArtifacts":true}}

      # A vault app should not ship unsigned by accident: without the signing secrets, a tag only runs the
      # tests. Start the workflow by hand (Actions → Release → Run workflow) to get an unsigned build.
      - name: No signing certificate
        if: env.HAS_CERTIFICATE != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "::warning::Signing secrets are not set, so no build was published for this tag. See the Releases section of the README."

      - name: Build (unsigned)
        if: env.HAS_CERTIFICATE != 'true' && github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Cloud Notebook v__VERSION__ (unsigned)
          releaseBody: |
            This build is not signed. The first time you open it, macOS will refuse; allow it under System Settings → Privacy & Security.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
