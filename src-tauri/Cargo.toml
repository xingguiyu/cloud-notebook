[package]
name = "app"
version = "0.8.0"
description = "Markdown notebook with an encrypted vault and project documents for AI coding"
authors = ["Sam Xing"]
license = "AGPL-3.0-only"
repository = "https://github.com/xingguiyu/cloud-notebook"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
notify-debouncer-mini = "0.7.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
md-5 = "0.11.0"
base64 = "0.23.1"
sha2 = "0.11.1"
rand = "0.8"
tauri-plugin-opener = "2"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
url = "2.5.8"
hmac = "0.13"
tauri-plugin-clipboard-manager = "2"
argon2 = "0.5"
futures-util = "0.3"
aes-gcm = "0.10"
tauri-plugin-deep-link = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
zeroize = "1.9.2"
x509-parser = "0.18"
p12-keystore = "0.4.1"
tauri-plugin-notification = "2"
dirs = "7"
sys-locale = "0.3.2"
unicode-normalization = "0.1.26"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSDictionary", "NSGeometry", "NSValue", "NSObject"] }
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation", "NSView", "NSResponder", "NSGraphics", "NSWindow"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "objc2-app-kit"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError", "block2"] }
objc2-vision = { version = "0.3", features = ["VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes", "objc2-core-foundation", "block2"] }

# 开发构建里也让密钥派生跑优化版本，否则 Argon2 解锁要等好几秒
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
